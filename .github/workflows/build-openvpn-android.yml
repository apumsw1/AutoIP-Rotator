
name: Build OpenVPN Android

on:
  workflow_dispatch:
  push:
    paths:
      - "native/openvpn-jni/**"
      - ".github/workflows/build-openvpn-android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build OpenVPN JNI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            build-essential \
            pkg-config

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build OpenVPN JNI
        working-directory: native/openvpn-jni
        run: |
          cargo ndk \
            --platform 24 \
            --target arm64-v8a \
            --target armeabi-v7a \
            --target x86_64 \
            --output-dir ../../app/src/main/jniLibs \
            build --release

      - name: Verify native libraries
        run: |
          find app/src/main/jniLibs -type f -name "*.so"
          test -f app/src/main/jniLibs/arm64-v8a/libopenvpn3_jni.so

      - name: Commit native libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/jniLibs/

          if git diff --cached --quiet; then
            echo "No native library changes."
          else
            git commit -m "Build OpenVPN Android native libraries"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-android-libraries
          path: app/src/main/jniLibs/
