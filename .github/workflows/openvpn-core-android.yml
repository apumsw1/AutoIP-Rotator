
name: OpenVPN 3 Android Core Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openvpn-core-android.yml"

permissions:
  contents: read

jobs:
  build-openvpn-core:
    name: Build OpenVPN Core (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang_prefix: aarch64-linux-android

          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang_prefix: armv7a-linux-androideabi

          - abi: x86
            rust_target: i686-linux-android
            clang_prefix: i686-linux-android

          - abi: x86_64
            rust_target: x86_64-linux-android
            clang_prefix: x86_64-linux-android

    steps:
      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            pkg-config \
            git \
            curl

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "Android SDK command-line tools not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK located successfully."
          "$SDKMANAGER" --version

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "ndk;27.2.12479018"

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -x "$NDK_BIN/llvm-ar" ]; then
            echo "ERROR: NDK installation could not be verified."
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "Android NDK installed successfully."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Check out OpenVPN 3 Rust bindings
        shell: bash
        run: |
          set -euo pipefail

          git clone --recurse-submodules \
            https://github.com/networks-rs/openvpn-connect-rs.git \
            "$RUNNER_TEMP/openvpn-connect-rs"

          cd "$RUNNER_TEMP/openvpn-connect-rs"

          git submodule update --init --recursive

      - name: Build OpenVPN Core for Android ABI
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          CLANG_PREFIX: ${{ matrix.clang_prefix }}
        
        run: |
          set -euo pipefail

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=24

          LINKER="$NDK_BIN/$CLANG_PREFIX$API-clang"
          CXX="$NDK_BIN/$CLANG_PREFIX$API-clang++"

          case "$RUST_TARGET" in
            aarch64-linux-android)
              TARGET_ENV=aarch64_linux_android
              ;;
            armv7-linux-androideabi)
              TARGET_ENV=armv7_linux_androideabi
              ;;
            i686-linux-android)
              TARGET_ENV=i686_linux_android
              ;;
            x86_64-linux-android)
              TARGET_ENV=x86_64_linux_android
              ;;
            *)
              echo "Unsupported target: $RUST_TARGET"
              exit 1
              ;;
          esac

          test -x "$LINKER"
          test -x "$CXX"

          export "CARGO_TARGET_${TARGET_ENV^^}_LINKER=$LINKER"
          export "CC_${TARGET_ENV}=$LINKER"
          export "CXX_${TARGET_ENV}=$CXX"
          export "AR_${TARGET_ENV}=$NDK_BIN/llvm-ar"
          export "RANLIB_${TARGET_ENV}=$NDK_BIN/llvm-ranlib"
          export ANDROID_PLATFORM="android-$API"

          cd "$RUNNER_TEMP/openvpn-connect-rs"

          echo "Target: $RUST_TARGET"
          echo "Compiler: $LINKER"

          rustc --version
          cargo --version

          cargo build \
            --release \
            -p openvpn-connect \
            --target "$RUST_TARGET" \
            --features vendor
