
name: OpenVPN 3 Android Core Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openvpn-core-android.yml"

permissions:
  contents: read

jobs:
  build-openvpn-core:
    name: Build OpenVPN Core (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang_prefix: aarch64-linux-android

          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang_prefix: armv7a-linux-androideabi

          - abi: x86
            rust_target: i686-linux-android
            clang_prefix: i686-linux-android

          - abi: x86_64
            rust_target: x86_64-linux-android
            clang_prefix: x86_64-linux-android

    steps:
      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            pkg-config \
            git \
            curl

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.2.12479018"

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/llvm-ar"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Check out OpenVPN 3 Rust bindings
        shell: bash
        run: |
          set -euo pipefail

          git clone --recurse-submodules \
            https://github.com/networks-rs/openvpn-connect-rs.git \
            "$RUNNER_TEMP/openvpn-connect-rs"

          cd "$RUNNER_TEMP/openvpn-connect-rs"
          git submodule update --init --recursive

      - name: Build OpenVPN Core for Android ABI
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          CLANG_PREFIX: ${{ matrix.clang_prefix }}
        run: |
          set -euo pipefail

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=24

          LINKER="$NDK_BIN/$CLANG_PREFIX$API-clang"
          CXX="$NDK_BIN/$CLANG_PREFIX$API-clang++"

          case "$RUST_TARGET" in
            aarch64-linux-android)
              TARGET_ENV=aarch64_linux_android
              ;;
            armv7-linux-androideabi)
              TARGET_ENV=armv7_linux_androideabi
              ;;
            i686-linux-android)
              TARGET_ENV=i686_linux_android
              ;;
            x86_64-linux-android)
              TARGET_ENV=x86_64_linux_android
              ;;
            *)
              echo "Unsupported Rust target: $RUST_TARGET"
              exit 1
              ;;
          esac

          test -x "$LINKER"
          test -x "$CXX"

          export "CARGO_TARGET_${TARGET_ENV^^}_LINKER=$LINKER"
          export CC="$LINKER"
          export CXX="$CXX"
          export AR="$NDK_BIN/llvm-ar"
          export RANLIB="$NDK_BIN/llvm-ranlib"
          export ANDROID_PLATFORM="android-$API"

          cd "$RUNNER_TEMP/openvpn-connect-rs"

          echo "Rust target: $RUST_TARGET"
          echo "Android linker: $LINKER"

          rustc --version
          cargo --version

          cargo build \
            --release \
            -p openvpn-connect \
            --target "$RUST_TARGET" \
            --features vendor

      - name: Upload Rust build output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-core-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/openvpn-connect-rs/target/${{ matrix.rust_target }}/release/deps/*.rlib
            ${{ runner.temp }}/openvpn-connect-rs/target/${{ matrix.rust_target }}/release/build/
          if-no-files-found: warn
          retention-days: 7
