
[package]
name = "openvpn-jni"
version = "0.1.0"
edition = "2021"

[lib]
name = "openvpn3_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
openvpn-connect = {
    git = "https://github.com/networks-rs/openvpn-connect-rs",
    package = "openvpn-connect",
    features = ["vendor", "tokio"]
}
tokio = {
    version = "1",
    features = ["rt", "time", "sync"]
}
